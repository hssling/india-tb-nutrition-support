[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "npychain"
version = "1.0.1"
description = "Who misses the TB nutrition payment, and where it matters most: a pre-registered State-level analysis of the Ni-kshay Poshan Yojana payment chain"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "tbprio @ git+https://github.com/hssling/india-tb-priority-tool@v1.0.1",
    "numpy==2.3.5",
    "scipy==1.16.3",
    "pdfplumber==0.11.8",
]

[project.optional-dependencies]
manuscript = [
    "matplotlib==3.10.7",
    "python-docx==1.2.0",
    "pillow==11.3.0",
    "pymupdf==1.27.2.3",
]
test = ["pytest==9.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = []
